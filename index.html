<style>
:root {
  --accent: #E8460A;
  --accent-dark: #C03808;
  --accent-light: #FFF0EB;
  --blue: #1565C0;
  --blue-light: #E8F0FE;
  --green: #059669;
  --green-light: #ECFDF5;
  --bg: #F5F5F2;
  --surface: #FFFFFF;
  --surface2: #F0F0EE;
  --text: #1A1A2E;
  --text2: #5A5A7A;
  --text3: #9A9AB0;
  --border: #E4E4EA;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --r: 16px;
  --r-sm: 10px;
  --nav-h: 68px;
  --header-h: 58px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }

/* HEADER */
.app-header { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; flex-shrink: 0; }
.app-logo-wrap { display: flex; align-items: center; gap: 9px; }
.app-logo-img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; box-shadow: 0 2px 6px rgba(232,70,10,0.25); }
.app-logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 21px; letter-spacing: -0.5px; color: var(--text); }
.app-logo span { color: var(--accent); }
.header-date { font-size: 12px; color: var(--text2); font-weight: 500; }

/* MAIN */
#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

/* VIEWS */
.view { display: none; padding: 16px 16px calc(var(--nav-h) + 16px); animation: fadeIn 0.2s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* BOTTOM NAV */
.bottom-nav { height: var(--nav-h); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; z-index: 10; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 8px 12px; border-radius: 8px; border: none; background: none; color: var(--text3); font-family: 'Barlow', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; transition: color 0.15s; }
.nav-btn .nav-icon { font-size: 22px; transition: transform 0.15s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active .nav-icon { transform: scale(1.12); }

/* ======== HOME ======== */
.home-hero { border-radius: var(--r); padding: 22px; color: white; margin-bottom: 14px; position: relative; overflow: hidden; background: var(--text); }
.home-hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; background: var(--accent); border-radius: 50%; opacity: 0.1; }
.hero-day-label { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.55; margin-bottom: 5px; }
.hero-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; line-height: 1.05; margin-bottom: 4px; }
.hero-subtitle { font-size: 13px; opacity: 0.65; margin-bottom: 18px; }
.hero-btn { display: block; width: 100%; background: var(--accent); color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 14px 20px; border-radius: 10px; border: none; cursor: pointer; transition: opacity 0.15s; text-align: center; }
.hero-btn:active { opacity: 0.85; }
.hero-btn.secondary { background: rgba(255,255,255,0.13); margin-top: 9px; font-size: 14px; font-weight: 700; }
.hero-completed { display: flex; align-items: center; gap: 10px; background: rgba(5,150,105,0.25); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 600; }

.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-card { background: var(--surface); border-radius: var(--r); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
.stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text2); }

.section-hdr { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); margin-bottom: 9px; margin-top: 18px; }

.progress-card { background: var(--surface); border-radius: var(--r); padding: 15px; box-shadow: var(--shadow); margin-bottom: 14px; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.progress-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
.progress-pct { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; color: var(--accent); }
.progress-bar-bg { background: var(--surface2); border-radius: 6px; height: 9px; overflow: hidden; }
.progress-bar-fill { background: linear-gradient(90deg, var(--accent), #FF8C42); height: 100%; border-radius: 6px; transition: width 0.8s ease; }
.progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text3); }

.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
.week-day { aspect-ratio: 1; background: var(--surface); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-shadow: var(--shadow); }
.week-day-name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text3); }
.week-day-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.week-day.gym .week-day-name { color: var(--accent); }
.week-day.gym .week-day-dot { background: var(--accent); opacity: 0.3; }
.week-day.done .week-day-dot { background: var(--green); opacity: 1; }
.week-day.today { outline: 2.5px solid var(--accent); outline-offset: -1px; }

.prog-item { background: var(--surface); border-radius: var(--r); padding: 13px 15px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 8px; transition: opacity 0.15s; }
.prog-item:active { opacity: 0.8; }
.prog-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.prog-info-day { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; }
.prog-info-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 900; }
.prog-info-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }

/* ======== TRAINING ======== */
.training-header { background: var(--surface); border-radius: var(--r); padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow); }
.training-day-name { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.training-title { font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 900; }
.t-prog-bar { margin-top: 11px; background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
.t-prog-fill { background: var(--accent); height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.t-prog-text { margin-top: 5px; font-size: 11px; color: var(--text2); }

.day-tabs { display: flex; gap: 7px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { flex-shrink: 0; padding: 7px 15px; border-radius: 20px; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.15s; box-shadow: var(--shadow); }

.ex-card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); margin-bottom: 11px; border-left: 4px solid var(--border); transition: border-color 0.2s; }
.ex-card.active { border-left-color: var(--accent); }
.ex-card.done { border-left-color: var(--green); }
.ex-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.ex-num { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 2px; }
.ex-name { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 900; line-height: 1.1; }
.ex-muscle { font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.ex-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
.ex-sci { background: var(--blue-light); border-radius: 9px; padding: 9px 11px; font-size: 12px; color: #1040A0; line-height: 1.5; margin-bottom: 9px; }
.ex-sci strong { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; opacity: 0.65; }
.ex-cue { background: var(--surface2); border-radius: 9px; padding: 9px 11px; font-size: 12px; color: var(--text2); line-height: 1.5; margin-bottom: 9px; }
.ex-cue strong { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; color: var(--text3); }
.ex-prev { font-size: 12px; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ex-prev-badge { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-weight: 600; color: var(--text); font-size: 12px; }

.sets-tbl { width: 100%; border-collapse: collapse; }
.sets-tbl th { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text3); padding: 0 0 7px; text-align: left; }
.sets-tbl td { padding: 4px 0; vertical-align: middle; }
.set-num { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--text2); width: 28px; }
.set-input { background: var(--surface2); border: 2px solid transparent; border-radius: 8px; padding: 8px 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); width: 66px; text-align: center; transition: border-color 0.15s; -webkit-appearance: none; }
.set-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.set-x { color: var(--text3); font-size: 14px; font-weight: 700; padding: 0 6px; }
.set-done-btn { background: var(--surface2); border: none; border-radius: 8px; padding: 8px 10px; font-size: 18px; cursor: pointer; transition: all 0.15s; margin-left: 4px; }
.set-done-btn.done { background: var(--green-light); }
.set-done-btn:active { transform: scale(0.9); }
.set-row.completed .set-input { opacity: 0.5; }

.finish-btn { width: 100%; padding: 17px; background: var(--green); color: white; font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; border: none; border-radius: var(--r); cursor: pointer; margin-top: 14px; transition: opacity 0.15s; }
.finish-btn:active { opacity: 0.85; }

/* ======== HISTORY ======== */
.hist-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.hist-stat { background: var(--surface); border-radius: var(--r); padding: 15px; box-shadow: var(--shadow); }
.hist-stat .val { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1; }
.hist-stat .lbl { font-size: 12px; color: var(--text2); font-weight: 500; margin-top: 4px; }
.wo-item { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); margin-bottom: 9px; cursor: pointer; transition: opacity 0.15s; }
.wo-item:active { opacity: 0.8; }
.wo-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wo-date { font-size: 12px; color: var(--text2); }
.wo-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
.wo-tag.martes { background: var(--accent-light); color: var(--accent); }
.wo-tag.miercoles { background: var(--blue-light); color: var(--blue); }
.wo-tag.viernes { background: var(--green-light); color: var(--green); }
.wo-title { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; margin-bottom: 3px; }
.wo-stats { font-size: 11px; color: var(--text2); }

.ep-card { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.ep-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; }
.ep-muscle { font-size: 11px; color: var(--text2); margin-bottom: 10px; }
.mini-chart { height: 55px; display: flex; align-items: flex-end; gap: 4px; }
.mini-bar { flex: 1; background: var(--accent); opacity: 0.65; border-radius: 3px 3px 0 0; min-height: 4px; }
.mini-bar:last-child { opacity: 1; }

/* ======== SCIENCE ======== */
.sci-card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); margin-bottom: 11px; }
.sci-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; margin-bottom: 9px; display: flex; align-items: center; gap: 7px; }
.sci-card p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 8px; }
.sci-card p:last-child { margin-bottom: 0; }
.sci-tag { display: inline-block; background: var(--blue-light); color: var(--blue); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-right: 4px; margin-bottom: 7px; }

/* ======== MODALS ======== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: flex-end; }
.modal-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
.modal-sheet { background: var(--surface); border-radius: var(--r) var(--r) 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; margin: 0 auto; animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 34px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; margin-bottom: 10px; }
.modal-text { font-size: 14px; color: var(--text2); line-height: 1.65; margin-bottom: 16px; }
.modal-btn { width: 100%; padding: 15px; border-radius: var(--r-sm); border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer; margin-bottom: 9px; transition: opacity 0.15s; }
.modal-btn.primary { background: var(--accent); color: white; }
.modal-btn.secondary { background: var(--surface2); color: var(--text2); }
.modal-btn:active { opacity: 0.85; }
.modal-btn:last-child { margin-bottom: 0; }

/* TIMER */
.timer-circle { width: 138px; height: 138px; border-radius: 50%; background: var(--surface2); margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; position: relative; }
.timer-circle svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.timer-num { font-family: 'Barlow Condensed', sans-serif; font-size: 50px; font-weight: 900; color: var(--accent); }
.timer-msg { text-align: center; font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 14px; }
.timer-opts { display: flex; gap: 7px; margin-bottom: 14px; }
.timer-opt { flex: 1; padding: 9px; background: var(--surface2); border-radius: 8px; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--text2); transition: all 0.15s; }
.timer-opt.active { background: var(--accent-light); color: var(--accent); }

/* COMPLETE */
.comp-content { text-align: center; padding: 8px 0; }
.comp-icon { font-size: 54px; margin-bottom: 10px; }
.comp-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; margin-bottom: 5px; }
.comp-sub { font-size: 14px; color: var(--text2); margin-bottom: 18px; }
.comp-stats { display: flex; justify-content: center; gap: 22px; margin-bottom: 22px; }
.comp-stat .v { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent); }
.comp-stat .l { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; }

/* DETAIL */
.det-ex { padding: 11px 0; border-bottom: 1px solid var(--border); }
.det-ex:last-child { border-bottom: none; }
.det-ex-name { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; margin-bottom: 5px; }
.det-sets { display: flex; gap: 5px; flex-wrap: wrap; }
.det-set { background: var(--surface2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }

/* TOAST */
.toast { position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%; transform: translateX(-50%) translateY(12px); background: #1A1A2E; color: white; padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transition: all 0.3s; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* EMPTY STATE */
.empty-st { text-align: center; padding: 40px 16px; }
.empty-st .ico { font-size: 38px; margin-bottom: 10px; }
.empty-st h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 5px; }
.empty-st p { font-size: 13px; color: var(--text2); }

.init-bar { background: var(--surface); border-radius: var(--r); padding: 13px 15px; box-shadow: var(--shadow); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.init-bar-btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 18px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
.done-bar { background: var(--green-light); border-radius: var(--r); padding: 13px 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--green); }
</style>

let currentView = 'home';
let currentWorkout = null;
let trainingDayKey = null;
let timerInterval = null;
let timerTotal = 90;
let timerRemaining = 90;
let workoutStartTime = null;
let motivIdx = 0;

const S = {
  get workouts() { try { return JSON.parse(localStorage.getItem('mu_w') || '{}'); } catch { return {}; } },
  setWorkouts(v) { localStorage.setItem('mu_w', JSON.stringify(v)); },
};

function todayKey() { return new Date().toISOString().slice(0, 10); }

function getDayName() {
  const d = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  return d[new Date().getDay()];
}

function getTodayProgram() { return DAYS[getDayName()] || null; }

function isTodayDone() {
  const w = S.workouts[todayKey()];
  return w && w.completed;
}

function getStreak() {
  const ws = S.workouts;
  return Object.values(ws).filter(w => w.completed).length;
}

function getDaysToJune() {
  const t = new Date();
  const j = new Date(t.getFullYear(), 5, 1);
  if (t >= j) { const nj = new Date(t.getFullYear()+1,5,1); return Math.ceil((nj-t)/86400000); }
  return Math.ceil((j-t)/86400000);
}

function getProgressPct() {
  const s = new Date('2026-04-18'), e = new Date('2026-06-01'), t = new Date();
  return Math.max(0, Math.min(100, Math.round(((t-s)/(e-s))*100)));
}

function getNextGymDay() {
  const names = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const gym = [2,3,5];
  const td = new Date().getDay();
  for (let i=1; i<=7; i++) {
    const nd = (td+i)%7;
    if (gym.includes(nd)) return names[nd].charAt(0).toUpperCase()+names[nd].slice(1);
  }
  return 'Martes';
}

function findExercise(id) {
  for (const day of Object.values(DAYS)) {
    const ex = day.exercises.find(e => e.id === id);
    if (ex) return ex;
  }
  return null;
}

function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  const target = btn || document.querySelector(`.nav-btn[data-view="${name}"]`);
  if (target) target.classList.add('active');
  currentView = name;
  if (name === 'home') renderHome();
  else if (name === 'training') renderTraining();
  else if (name === 'history') renderHistory();
  else if (name === 'science') renderScience();
  document.getElementById('main').scrollTop = 0;
}

function startWorkout() {
  const prog = getTodayProgram();
  if (!prog) { showToast('Hoy no toca gym 😄'); return; }
  const day = getDayName();
  trainingDayKey = day;
  currentWorkout = { day, date: todayKey(), exercises: {}, completed: false, startTime: Date.now() };
  workoutStartTime = Date.now();
  showView('training');
}

function renderTraining() {
  const c = document.getElementById('view-training');
  let dk = trainingDayKey;
  if (!dk || !DAYS[dk]) { dk = getDayName(); if (!DAYS[dk]) dk = 'martes'; trainingDayKey = dk; }
  const prog = DAYS[dk];
  const isToday = dk === getDayName();
  const ws = S.workouts;
  const existingWo = (ws[todayKey()] && ws[todayKey()].day === dk) ? ws[todayKey()] : null;

  // Auto-inicializar workout si es el día de hoy y no hay sesión activa ni completada
  if (isToday && !existingWo?.completed && (!currentWorkout || currentWorkout.day !== dk)) {
    currentWorkout = { day: dk, date: todayKey(), exercises: {}, completed: false, startTime: null };
  }

  const isActive = !!(currentWorkout && currentWorkout.day === dk && !existingWo?.completed);

  // Tabs
  const tabsHTML = `<div class="day-tabs">${Object.entries(DAYS).map(([key,d])=>{
    const isSel=key===dk;
    return `<button class="day-tab" onclick="trainingDayKey='${key}';renderTraining()"
      style="background:${isSel?d.color:'var(--surface)'};color:${isSel?'white':'var(--text2)'}">${d.name}</button>`;
  }).join('')}</div>`;

  // Barra de estado
  let statusBar = '';
  if (existingWo?.completed) {
    statusBar = `<div class="done-bar">✅ Sesión completada hoy</div>`;
  } else if (isActive && !currentWorkout.startTime) {
    statusBar = `<div class="init-bar">
      <div style="font-size:13px;font-weight:600;color:var(--text2);">Apunta tus cargas y pulsa ✅ al terminar cada serie</div>
      <button class="init-bar-btn" onclick="markSessionStart()">▶ INICIAR</button>
    </div>`;
  } else if (isActive && currentWorkout.startTime) {
    statusBar = `<div class="done-bar" style="background:#FFF0EB;color:var(--accent);">🔴 EN CURSO — registra series y finaliza al acabar</div>`;
  }

  // Barra de progreso
  let totalSets=0, doneSets=0;
  if (isActive && currentWorkout.exercises) {
    prog.exercises.forEach(ex => { totalSets += ex.sets; });
    Object.values(currentWorkout.exercises).forEach(sets => { doneSets += sets.filter(s=>s.done).length; });
  }
  const pct = totalSets > 0 ? Math.round((doneSets/totalSets)*100) : 0;

  const headerHTML = `
    <div class="training-header">
      <div class="training-day-name">${prog.name}${currentWorkout?.startTime?' · EN CURSO':''}</div>
      <div class="training-title">${prog.title}</div>
      <div class="t-prog-bar"><div class="t-prog-fill" id="tpf" style="width:${pct}%"></div></div>
      <div class="t-prog-text" id="tpt">${isActive?`${doneSets} / ${totalSets} series`:prog.exercises.length+' ejercicios · ~60 min'}</div>
    </div>`;

  const exercisesHTML = prog.exercises.map((ex, idx) => renderExCard(ex, idx, dk, isActive, existingWo)).join('');

  const finishBtn = (isActive && currentWorkout?.startTime)
    ? `<button class="finish-btn" onclick="finishWorkout()">🏆 FINALIZAR ENTRENO</button>`
    : isActive
    ? `<button class="finish-btn" onclick="markSessionStart();finishWorkout()" style="background:var(--text2)">⏹ GUARDAR SESIÓN</button>`
    : '';

  c.innerHTML = tabsHTML + statusBar + headerHTML + exercisesHTML + finishBtn;
}

function markSessionStart() {
  if (currentWorkout && !currentWorkout.startTime) {
    currentWorkout.startTime = Date.now();
    workoutStartTime = Date.now();
    renderTraining();
  }
}

function renderExCard(ex, idx, dk, isActive, existingWo) {
  const prog = DAYS[dk];
  const ws = S.workouts;

  // Previous best
  const allWo = Object.values(ws).filter(w => w.completed && w.exercises[ex.id]);
  let prevBest = null;
  if (allWo.length > 0) {
    const last = allWo.sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
    const sets = last.exercises[ex.id] || [];
    const doneSets = sets.filter(s => s.done && s.weight);
    if (doneSets.length > 0) {
      const best = doneSets.reduce((p, s) => ((parseFloat(s.weight)*parseInt(s.reps)) > (parseFloat(p.weight)*parseInt(p.reps)) ? s : p));
      prevBest = `${best.weight}kg × ${best.reps} reps`;
    }
  }

  // Inicializar sets si es activo
  if (isActive) {
    if (!currentWorkout.exercises[ex.id]) {
      currentWorkout.exercises[ex.id] = Array.from({length: ex.sets}, () => ({weight:'',reps:'',done:false}));
    }
  }

  // Siempre mostrar inputs — ya sea de sesión activa, completada, o vacíos
  const displaySets = isActive
    ? currentWorkout.exercises[ex.id]
    : (existingWo?.exercises?.[ex.id] || Array.from({length: ex.sets}, () => ({weight:'',reps:'',done:false})));

  const isExDone = displaySets.filter(s=>s.done).length >= ex.sets;
  const borderColor = isExDone ? 'var(--green)' : isActive ? prog.color : 'var(--border)';
  const readOnly = ''; // siempre editable — permite planificar/corregir cualquier día

  const setsContent = `
    <div style="margin-bottom:10px;">
      <table class="sets-tbl">
        <thead><tr>
          <th style="width:26px">#</th>
          <th>Kg</th>
          <th style="padding-left:4px">Reps</th>
          <th style="text-align:right;padding-right:2px">✓</th>
        </tr></thead>
        <tbody>${displaySets.map((s,si)=>`
          <tr class="set-row${s.done?' completed':''}" id="sr-${ex.id}-${si}">
            <td class="set-num">${si+1}</td>
            <td><input class="set-input" type="number" inputmode="decimal" value="${s.weight||''}" placeholder="—"
              onchange="updateSet('${ex.id}',${si},'weight',this.value)" ${readOnly}
              style="${s.done?'opacity:0.5':''}"></td>
            <td class="set-x">×</td>
            <td><input class="set-input" type="number" inputmode="numeric" value="${s.reps||''}" placeholder="${ex.reps.split('–')[0]}"
              onchange="updateSet('${ex.id}',${si},'reps',this.value)" ${readOnly}
              style="${s.done?'opacity:0.5':''}"></td>
            <td><button class="set-done-btn${s.done?' done':''}"
              onclick="toggleSetDone('${ex.id}',${si},'${dk}')">${s.done?'✅':'⭕'}</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <button onclick="startTimer(${ex.rest})" style="
      width:100%;padding:10px;border-radius:9px;border:none;
      background:var(--surface2);color:var(--text2);
      font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
      transition:background 0.15s;letter-spacing:0.3px;
    ">⏱ Iniciar descanso · ${ex.rest}s</button>`;

  return `
    <div class="ex-card${isExDone?' done':isActive?' active':''}" style="border-left-color:${borderColor}">
      <div class="ex-head">
        <div>
          <div class="ex-num">Ejercicio ${idx+1} · ${ex.muscle}</div>
          <div class="ex-name">${ex.name}</div>
        </div>
        <div class="ex-badge" style="background:${prog.colorLight};color:${prog.color}">${ex.sets}×${ex.reps}</div>
      </div>
      <div class="ex-sci"><strong>📚 Evidencia científica</strong>${ex.science}</div>
      <div class="ex-cue"><strong>💡 Ejecución clave</strong>${ex.cue}</div>
      ${prevBest?`<div class="ex-prev">Última sesión: <span class="ex-prev-badge">🏆 ${prevBest}</span></div>`:''}
      ${setsContent}
    </div>`;
}

function updateSet(exId, si, field, val) {
  const wo = ensureWorkout(trainingDayKey);
  if (!wo?.exercises?.[exId]) return;
  wo.exercises[exId][si][field] = val;
}

function ensureWorkout(dayKey) {
  dayKey = dayKey || trainingDayKey || getDayName();
  if (!DAYS[dayKey]) return null;
  if (!currentWorkout || currentWorkout.day !== dayKey) {
    currentWorkout = { day: dayKey, date: todayKey(), exercises: {}, completed: false, startTime: null };
  }
  const prog = DAYS[dayKey];
  prog.exercises.forEach(ex => {
    if (!currentWorkout.exercises[ex.id]) {
      currentWorkout.exercises[ex.id] = Array.from({length: ex.sets}, () => ({weight:'',reps:'',done:false}));
    }
  });
  return currentWorkout;
}

function toggleSetDone(exId, si, dayKey) {
  const wo = ensureWorkout(dayKey);
  if (!wo?.exercises?.[exId]) return;
  const set = wo.exercises[exId][si];
  set.done = !set.done;
  // Auto-iniciar sesión si se marca la primera serie
  if (set.done && !wo.startTime) {
    wo.startTime = Date.now();
  }
  if (set.done) {
    const ex = findExercise(exId);
    startTimer(ex ? ex.rest : 90);
  }
  const btn = document.querySelector(`#sr-${exId}-${si} .set-done-btn`);
  if (btn) { btn.className = `set-done-btn${set.done?' done':''}`; btn.textContent = set.done?'✅':'⭕'; }
  const row = document.getElementById(`sr-${exId}-${si}`);
  if (row) row.className = `set-row${set.done?' completed':''}`;
  updateTProgBar();
  // Re-render si acabamos de iniciar para actualizar UI
  if (set.done && wo.startTime && Date.now() - wo.startTime < 1000) {
    renderTraining();
  }
}

function updateTProgBar() {
  if (!currentWorkout) return;
  const prog = DAYS[currentWorkout.day]; if (!prog) return;
  const total = prog.exercises.reduce((a,ex)=>a+ex.sets,0);
  let done = 0;
  Object.values(currentWorkout.exercises).forEach(s => { done += s.filter(x=>x.done).length; });
  const pct = total > 0 ? Math.round((done/total)*100) : 0;
  const fill = document.getElementById('tpf'), txt = document.getElementById('tpt');
  if (fill) fill.style.width = pct+'%';
  if (txt) txt.textContent = `${done} / ${total} series completadas`;
}

function finishWorkout() {
  if (!currentWorkout) return;
  const dur = Math.round((Date.now() - (currentWorkout.startTime||Date.now()-3600000)) / 60000);
  currentWorkout.completed = true; currentWorkout.duration = Math.max(1,dur); currentWorkout.date = todayKey();
  const ws = S.workouts; ws[todayKey()] = currentWorkout; S.setWorkouts(ws);
  stopTimer();
  let totalDone = 0;
  Object.values(currentWorkout.exercises).forEach(s=>{ totalDone+=s.filter(x=>x.done).length; });
  document.getElementById('completeContent').innerHTML = `
    <div class="comp-icon">🏆</div>
    <div class="comp-title">¡SESIÓN COMPLETADA!</div>
    <div class="comp-sub">Brutal, crack. El músculo crece ahora.</div>
    <div class="comp-stats">
      <div class="comp-stat"><div class="v">${currentWorkout.duration}</div><div class="l">minutos</div></div>
      <div class="comp-stat"><div class="v">${totalDone}</div><div class="l">series</div></div>
      <div class="comp-stat"><div class="v">${getStreak()}</div><div class="l">sesiones</div></div>
    </div>
    <button class="modal-btn primary" onclick="closeModal('completeModal');showView('home')">Ver resumen</button>
  `;
  showModal('completeModal');
  currentWorkout = null;
}

function renderHistory() {
  const c = document.getElementById('view-history');
  const ws = S.workouts;
  const completed = Object.entries(ws).filter(([,w])=>w.completed).sort(([a],[b])=>b.localeCompare(a));
  if (completed.length === 0) {
    c.innerHTML = `<div class="empty-st"><div class="ico">📊</div><h3>Sin historial aún</h3><p>Completa tu primer entreno para ver tu progreso aquí</p></div>`;
    return;
  }
  const totSeries = completed.reduce((acc,[,w])=>acc+Object.values(w.exercises||{}).reduce((a,s)=>a+s.filter(x=>x.done).length,0),0);
  const progHTML = renderExerciseProgression(ws);
  const items = completed.slice(0,15).map(([date,w])=>{
    const prog = DAYS[w.day]; if (!prog) return '';
    const sets = Object.values(w.exercises||{}).reduce((a,s)=>a+s.filter(x=>x.done).length,0);
    const dObj = new Date(date+'T12:00:00');
    const dStr = dObj.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'});
    return `<div class="wo-item" onclick="showWoDetail('${date}')">
      <div class="wo-item-head"><div class="wo-date">${dStr}</div><span class="wo-tag ${w.day}">${prog.name}</span></div>
      <div class="wo-title">${prog.title}</div>
      <div class="wo-stats">${sets} series · ${w.duration||'~60'} min</div>
    </div>`;
  }).join('');
  c.innerHTML = `
    <div class="hist-summary">
      <div class="hist-stat"><div class="val">${completed.length}</div><div class="lbl">Sesiones completadas</div></div>
      <div class="hist-stat"><div class="val">${totSeries}</div><div class="lbl">Series totales</div></div>
    </div>
    ${progHTML}
    <div class="section-hdr">Sesiones recientes</div>
    ${items}`;
}

function renderExerciseProgression(ws) {
  const exData = {};
  Object.entries(ws).filter(([,w])=>w.completed).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,w])=>{
    Object.entries(w.exercises||{}).forEach(([id,sets])=>{
      const mw = Math.max(...sets.map(s=>parseFloat(s.weight)||0));
      if (mw>0) { if(!exData[id]) exData[id]=[]; exData[id].push({date,weight:mw}); }
    });
  });
  const tracked = Object.entries(exData).filter(([,d])=>d.length>=2);
  if (!tracked.length) return '';
  const html = tracked.slice(0,4).map(([id,data])=>{
    const ex = findExercise(id); if(!ex) return '';
    const maxW = Math.max(...data.map(d=>d.weight));
    const bars = data.slice(-8).map(d=>{
      const h = maxW>0 ? Math.round((d.weight/maxW)*100) : 20;
      return `<div class="mini-bar" style="height:${h}%" title="${d.weight}kg"></div>`;
    }).join('');
    const lat = data[data.length-1], prv = data[data.length-2];
    const diff = lat.weight - prv.weight;
    const diffStr = diff>=0 ? `▲ +${diff}kg` : `▼ ${diff}kg`;
    const diffColor = diff>=0 ? 'var(--green)' : '#E8460A';
    return `<div class="ep-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div><div class="ep-name">${ex.name}</div><div class="ep-muscle">${ex.muscle}</div></div>
        <div style="text-align:right;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;">${lat.weight}kg</div>
          <div style="font-size:11px;color:${diffColor};font-weight:700;">${diffStr}</div>
        </div>
      </div>
      <div class="mini-chart">${bars}</div>
    </div>`;
  }).join('');
  if (!html.trim()) return '';
  return `<div class="section-hdr">Progresión de carga</div>${html}`;
}

function showWoDetail(date) {
  const w = S.workouts[date]; if(!w) return;
  const prog = DAYS[w.day]; if(!prog) return;
  const dObj = new Date(date+'T12:00:00');
  const dStr = dObj.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const exHTML = Object.entries(w.exercises||{}).map(([id,sets])=>{
    const ex = findExercise(id); if(!ex) return '';
    const done = sets.filter(s=>s.done); if(!done.length) return '';
    return `<div class="det-ex">
      <div class="det-ex-name">${ex.name}</div>
      <div class="det-sets">${done.map((s,i)=>`<div class="det-set">${i+1}: ${s.weight?s.weight+'kg':'—'} × ${s.reps||'—'}</div>`).join('')}</div>
    </div>`;
  }).join('');
  document.getElementById('detailContent').innerHTML = `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${prog.color};margin-bottom:3px">${prog.name}</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;margin-bottom:3px">${prog.title}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:14px">${dStr} · ${w.duration||'~60'} min</div>
    ${exHTML||'<p style="color:var(--text2);font-size:13px">Sin series registradas</p>'}
    <div style="height:12px"></div>`;
  showModal('detailModal');
}

// ============================================================
// TIMER
// ============================================================

function startTimer(dur) {
  stopTimer();
  timerTotal = timerRemaining = dur;
  document.querySelectorAll('.timer-opt').forEach(b => b.classList.toggle('active', parseInt(b.textContent)===dur));
  updateTimerUI();
  showModal('timerModal');
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerUI();
    if (timerRemaining <= 0) {
      stopTimer(); closeModal('timerModal');
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      showToast('⏰ ¡Descanso listo! Siguiente serie.');
    }
  }, 1000);
}

function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
function skipTimer() { stopTimer(); closeModal('timerModal'); }

function setTimer(s) {
  document.querySelectorAll('.timer-opt').forEach(b => b.classList.toggle('active', parseInt(b.textContent)===s));
  stopTimer();
  timerTotal = timerRemaining = s;
  updateTimerUI();
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerUI();
    if (timerRemaining <= 0) {
      stopTimer(); closeModal('timerModal');
      if (navigator.vibrate) navigator.vibrate([200,100,200]);
      showToast('⏰ ¡Descanso listo!');
    }
  }, 1000);
}

function updateTimerUI() {
  const num = document.getElementById('timerNum');
  const circ = document.getElementById('timerCircle');
  if (num) num.textContent = timerRemaining;
  if (circ) {
    const C = 2 * Math.PI * 61; // r=61
    const prog = timerRemaining / Math.max(1, timerTotal);
    circ.style.strokeDasharray = C;
    circ.style.strokeDashoffset = C * (1 - prog);
  }
}

function showToast(msg) {

  setTimeout(()=>el.classList.remove('show'), 2600);
}

function registerSW() {
  if ('serviceWorker' in navigator) {
    const code = `
const C='msci-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['/'])));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>r)));});`;
    const blob = new Blob([code], {type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
